name: Test libxml2 Versions
on: [push, pull_request]

jobs:
  libxml-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Define the versions you want to compare
        libxml-version: ["2.9.4", "2.12.0", "2.13.0", "2.14.0", "2.15.1"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      #- name: Cache libxml2 Build
      #  id: cache-libxml
      #  uses: actions/cache@v4
      #  with:
      #    path: ~/libxml2-${{ matrix.libxml-version }}-install
      #    key: libxml2-${{ matrix.libxml-version }}-v1

      - name: Build libxml2
        # if: steps.cache-libxml.outputs.cache-hit != 'true'
        run: |
          MINOR_VER=$(echo ${{ matrix.libxml-version }} | cut -d. -f1-2)
          wget https://download.gnome.org/sources/libxml2/$MINOR_VER/libxml2-${{ matrix.libxml-version }}.tar.xz
          tar -xf libxml2-${{ matrix.libxml-version }}.tar.xz
          cd libxml2-${{ matrix.libxml-version }}
          ./configure --prefix=$HOME/libxml2-${{ matrix.libxml-version }}-install --without-python
          make -j$(nproc)
          make install

      - name: Run Test with Custom libxml2
        run: |
          # Point the linker to our custom build
          export LD_LIBRARY_PATH=$HOME/libxml2-${{ matrix.libxml-version }}-install/lib:$LD_LIBRARY_PATH
          php -r "file_put_contents('test_script.php', base64_decode(''));"
          echo "--- Showing Test ---"
          cat test_script.php
          echo ""
          echo "--- Running Test ---"
          php test_script.php
          echo ""
