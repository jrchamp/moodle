name: Test libxml2 Versions
on: [push, pull_request]

jobs:
  libxml-test:
    runs-on: ubuntu-latest

    env:
      CUSTOM_LIBXML_PATH: /opt/libxml2-custom

    strategy:
      fail-fast: false
      matrix:
        libxml-version: ['2.9.4', '2.12.0', '2.13.0', '2.14.0', '2.14.6', '2.15.0', '2.15.2']
        php-version: ['8.3', '8.4', '8.5']

    steps:
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: none

      #- name: Cache libxml2 Build
      #  id: cache-libxml
      #  uses: actions/cache@v4
      #  with:
      #    path: $CUSTOM_LIBXML_PATH
      #    key: libxml2-${{ matrix.libxml-version }}-v1

      - name: Build libxml2
        # if: steps.cache-libxml.outputs.cache-hit != 'true'
        run: |
          MINOR_VER=$(echo ${{ matrix.libxml-version }} | cut -d. -f1-2)
          wget https://download.gnome.org/sources/libxml2/$MINOR_VER/libxml2-${{ matrix.libxml-version }}.tar.xz
          tar -xf libxml2-${{ matrix.libxml-version }}.tar.xz
          cd libxml2-${{ matrix.libxml-version }}
          ./configure --prefix=$CUSTOM_LIBXML_PATH --without-python
          make -j$(nproc)
          make install

      - name: Recompile PHP Extensions
        run: |
          export PKG_CONFIG_PATH="$CUSTOM_LIBXML_PATH/lib/pkgconfig:$PKG_CONFIG_PATH"
          cd $HOME
          git clone --depth 1 --branch PHP-$(php -r "echo PHP_VERSION;") https://github.com/php/php-src.git
          cd $HOME/php-src/ext/dom
          phpize
          ./configure
          make -j$(nproc)
          echo "extension=$HOME/php-src/ext/dom/modules/dom.so" | sudo tee $(php -i | grep "Scan this dir for additional .ini files" | awk '{print $9}')/20-dom.ini

      - name: Run Test with custom libxml2
        run: |
          # Point the linker to our custom build
          export LD_LIBRARY_PATH=$CUSTOM_LIBXML_PATH/lib:$LD_LIBRARY_PATH
          php -r "file_put_contents('test_script.php', base64_decode(''));"
          echo "--- Showing Test ---"
          cat test_script.php
          echo ""
          echo "--- Running Test ---"
          php test_script.php
          echo ""
